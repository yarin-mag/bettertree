[package]
name = "bettertree"
version = "0.1.0"
edition = "2021"

[lib]
name = "bettertree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
git2 = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
dirs = "5"
notify = "6"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

# Build OpenSSL from source on macOS so the Intel build can be cross-compiled
# on Apple Silicon CI runners (Homebrew's OpenSSL there is arm64-only).
[target.'cfg(target_os = "macos")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[features]
e2e-testing = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tempfile = "3"
