name: Release

# Push a tag like v0.1.0 to build installers and attach them to a draft
# GitHub release. Review the draft on the Releases page, then publish it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Bettertree ${{ github.ref_name }}"
          releaseBody: |
            ## Downloads

            - **Windows:** `Bettertree_*_x64-setup.exe` (or the `.msi`)
            - **macOS (Apple Silicon, M1 and later):** `Bettertree_*_aarch64.dmg`
            - **macOS (Intel):** `Bettertree_*_x64.dmg`

            These builds are not code-signed yet.
            - Windows: if SmartScreen appears, click **More info → Run anyway**.
            - macOS: if the app "is damaged" or "can't be opened", run
              `xattr -cr /Applications/Bettertree.app` once, then open it.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
